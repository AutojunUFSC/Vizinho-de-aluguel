{% extends "base.html" %}

{% block title %}Minhas Solicitações{% endblock %}

{% block content %}

<!-- HEADER -->
<section class="bg-blue-900 text-white">
    <div class="max-w-7xl mx-auto px-6 py-10 flex items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold">Minhas Solicitações</h1>
            <p class="text-blue-300 mt-1 text-sm md:text-base">Acompanhe suas solicitações e propostas recebidas</p>
        </div>
        <a href="/nova_solicitacao/" class="shrink-0 px-5 py-2.5 text-sm font-semibold text-blue-900 bg-white hover:bg-blue-50 active:scale-95 rounded-lg shadow-sm transition-all duration-150">
            Nova Solicitação
        </a>
    </div>
</section>

<section class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-4xl mx-auto px-4">

        <!-- TABS -->
        <div class="flex gap-2 mb-6">
            <button id="tab-ativas" onclick="showTab('ativas')"
                class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold rounded-lg border border-blue-900 text-blue-900 bg-white shadow-sm transition-all duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="tab-ativas-label">Ativas</span>
            </button>
            <button id="tab-finalizadas" onclick="showTab('finalizadas')"
                class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold rounded-lg border border-gray-300 text-gray-500 bg-white hover:border-blue-900 hover:text-blue-900 transition-all duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="tab-finalizadas-label">Finalizadas</span>
            </button>
        </div>

        <!-- ATIVAS -->
        <div id="content-ativas" class="flex flex-col gap-5">
            <div class="flex justify-center py-10">
                <svg class="animate-spin w-6 h-6 text-blue-500" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
            </div>
        </div>

        <!-- FINALIZADAS -->
        <div id="content-finalizadas" class="hidden flex flex-col gap-5"></div>

    </div>
</section>

<script>
    requireAuth();

    const STATUS_ATIVOS     = ['OPEN', 'IN_AUCTION', 'AWARDED', 'IN_PROGRESS'];
    const STATUS_FINALIZADOS = ['COMPLETED', 'CANCELLED'];

    const STATUS_CONFIG = {
        OPEN:        { label: 'Aguardando Propostas',  cls: 'bg-gray-100 text-gray-700' },
        IN_AUCTION:  { label: 'Recebendo Propostas',   cls: 'bg-blue-600 text-white' },
        AWARDED:     { label: 'Proposta Aceita',        cls: 'bg-indigo-600 text-white' },
        IN_PROGRESS: { label: 'Em Andamento',           cls: 'bg-amber-500 text-white' },
        COMPLETED:   { label: 'Concluído',              cls: 'bg-green-100 text-green-700' },
        CANCELLED:   { label: 'Cancelado',              cls: 'bg-red-100 text-red-600' },
    };

    const URGENCY_LABELS = { ALTA: 'Urgente', MEDIA: 'Esta Semana', BAIXA: 'Flexível', EMERGENCIA: 'Emergência' };

    function fmtDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleDateString('pt-BR');
    }

    function fmtMoney(val) {
        if (val == null) return '';
        return 'R$ ' + Number(val).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    }

    function statusBadge(status) {
        const cfg = STATUS_CONFIG[status] || { label: status, cls: 'bg-gray-100 text-gray-600' };
        return `<span class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold ${cfg.cls} rounded-full">${escHtml(cfg.label)}</span>`;
    }

    function addressLabel(addr) {
        if (!addr) return '';
        return addr.neighborhood ? `${addr.neighborhood}, ${addr.city}` : (addr.city || '');
    }

    // ── Builds ───────────────────────────────────────────────────────────────

    function buildBidRow(bid) {
        const initial = (bid.mei_name || 'P').charAt(0).toUpperCase();
        const rating  = bid.mei_rating ? bid.mei_rating.toFixed(1) : '–';
        const hours   = bid.estimated_hours ? `${bid.estimated_hours}h` : '';
        return `
        <div class="flex items-center justify-between gap-3 p-3 rounded-lg bg-gray-50 hover:bg-blue-50 transition-all duration-150">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-9 h-9 rounded-full bg-blue-900 text-white flex items-center justify-center text-sm font-bold shrink-0">${escHtml(initial)}</div>
                <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                        <span class="text-sm font-semibold text-blue-950 truncate">${escHtml(bid.mei_name || 'Profissional')}</span>
                    </div>
                    <div class="flex items-center gap-1 text-xs text-gray-400">
                        <svg class="w-3 h-3 text-yellow-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                        </svg>
                        ${escHtml(rating)}
                        ${bid.notes ? `<span class="ml-1 truncate max-w-[160px]">· ${escHtml(bid.notes)}</span>` : ''}
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <div class="text-right">
                    <p class="text-base font-bold text-blue-700">${escHtml(fmtMoney(bid.amount))}</p>
                    <p class="text-xs text-gray-400">${escHtml(hours)}</p>
                </div>
            </div>
        </div>`;
    }

    function buildAtivaCard(req, bids) {
        const cat      = req.category_detail;
        const addr     = req.address_detail;
        const bidCount = bids.length;
        const bidsHtml = bids.length
            ? bids.map(buildBidRow).join('')
            : `<p class="text-sm text-gray-400 text-center py-2">Nenhuma proposta recebida ainda.</p>`;

        const showBids = ['OPEN', 'IN_AUCTION'].includes(req.status);

        return `
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
            <div class="p-5 flex items-start justify-between gap-4">
                <div class="flex-1 min-w-0">
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        ${cat ? `<span class="px-2.5 py-1 text-xs font-medium border border-gray-300 text-gray-600 rounded-full">${escHtml(cat.name)}</span>` : ''}
                        ${statusBadge(req.status)}
                        ${req.urgency ? `<span class="px-2.5 py-1 text-xs text-gray-500 border border-gray-200 rounded-full">${escHtml(URGENCY_LABELS[req.urgency] || req.urgency)}</span>` : ''}
                    </div>
                    <h3 class="text-base font-bold text-blue-950 mb-1">${escHtml(req.title)}</h3>
                    <p class="text-sm text-gray-500 mb-2 leading-relaxed line-clamp-2">${escHtml(req.description || '')}</p>
                    <div class="flex items-center gap-4 text-xs text-gray-400 flex-wrap">
                        ${addr && addr.neighborhood ? `
                        <span class="inline-flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            ${escHtml(addressLabel(addr))}
                        </span>` : ''}
                        <span class="inline-flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            ${escHtml(fmtDate(req.created_at))}
                        </span>
                    </div>
                </div>
                ${showBids ? `
                <div class="shrink-0 w-16 h-16 bg-blue-50 border border-blue-100 rounded-xl flex flex-col items-center justify-center">
                    <span class="text-2xl font-bold text-blue-800">${bidCount}</span>
                    <span class="text-xs text-blue-600 text-center leading-tight">${bidCount === 1 ? 'Proposta' : 'Propostas'}</span>
                </div>` : ''}
            </div>

            ${showBids ? `
            <div class="border-t border-gray-100 px-5 py-4">
                <div class="flex items-center gap-2 mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-sm font-semibold text-blue-950">Propostas Recebidas</span>
                </div>
                <div class="flex flex-col gap-2">${bidsHtml}</div>
            </div>` : ''}
        </div>`;
    }

    function buildFinCard(req) {
        const cat  = req.category_detail;
        const addr = req.address_detail;

        return `
        <div class="bg-white rounded-xl border border-gray-200 p-5">
            <div class="flex flex-wrap items-center gap-2 mb-3">
                ${cat ? `<span class="px-2.5 py-1 text-xs font-medium border border-gray-300 text-gray-600 rounded-full">${escHtml(cat.name)}</span>` : ''}
                ${statusBadge(req.status)}
            </div>
            <h3 class="text-base font-bold text-blue-950 mb-2">${escHtml(req.title)}</h3>
            <div class="flex items-center gap-4 text-xs text-gray-400 flex-wrap">
                ${addr && addr.neighborhood ? `
                <span class="inline-flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    ${escHtml(addressLabel(addr))}
                </span>` : ''}
                <span class="inline-flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    ${escHtml(fmtDate(req.created_at))}
                </span>
            </div>
        </div>`;
    }

    // ── Load ─────────────────────────────────────────────────────────────────

    async function load() {
        try {
            const res = await fetch('/api/v1/service-requests/mine/', { headers: getAuthHeaders() });
            if (res.status === 401) { logout(); return; }
            if (!res.ok) throw new Error();

            const data     = await res.json();
            const requests = Array.isArray(data) ? data : (data.results || []);

            const ativas     = requests.filter(r => STATUS_ATIVOS.includes(r.status));
            const finalizadas = requests.filter(r => STATUS_FINALIZADOS.includes(r.status));

            document.getElementById('tab-ativas-label').textContent     = `Ativas (${ativas.length})`;
            document.getElementById('tab-finalizadas-label').textContent = `Finalizadas (${finalizadas.length})`;

            // Busca lances para solicitações abertas em paralelo
            const bidsMap = {};
            await Promise.all(
                ativas
                    .filter(r => ['OPEN', 'IN_AUCTION'].includes(r.status))
                    .map(async r => {
                        try {
                            const bRes  = await fetch(`/api/v1/bids/?service_request=${r.id}`, { headers: getAuthHeaders() });
                            if (bRes.ok) {
                                const bData = await bRes.json();
                                bidsMap[r.id] = Array.isArray(bData) ? bData : (bData.results || []);
                            }
                        } catch {}
                    })
            );

            const ativasEl = document.getElementById('content-ativas');
            if (!ativas.length) {
                ativasEl.innerHTML = `
                    <div class="text-center py-16">
                        <p class="text-gray-400 text-sm mb-4">Você não tem solicitações ativas.</p>
                        <a href="/nova_solicitacao/" class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-blue-700 hover:bg-blue-800 rounded-lg transition-all">
                            Criar Solicitação
                        </a>
                    </div>`;
            } else {
                ativasEl.innerHTML = ativas.map(r => buildAtivaCard(r, bidsMap[r.id] || [])).join('');
            }

            const finEl = document.getElementById('content-finalizadas');
            if (!finalizadas.length) {
                finEl.innerHTML = '<p class="text-center text-sm text-gray-400 py-16">Nenhuma solicitação finalizada.</p>';
            } else {
                finEl.innerHTML = finalizadas.map(buildFinCard).join('');
            }

        } catch {
            document.getElementById('content-ativas').innerHTML =
                '<p class="text-center text-sm text-red-500 py-10">Erro ao carregar solicitações. Recarregue a página.</p>';
        }
    }

    load();

    // ── Tabs ──────────────────────────────────────────────────────────────────

    function showTab(tab) {
        const isAtivas = tab === 'ativas';
        document.getElementById('content-ativas').classList.toggle('hidden', !isAtivas);
        document.getElementById('content-finalizadas').classList.toggle('hidden', isAtivas);

        const active   = ['border-blue-900', 'text-blue-900', 'shadow-sm'];
        const inactive = ['border-gray-300', 'text-gray-500', 'hover:border-blue-900', 'hover:text-blue-900'];

        const btnA = document.getElementById('tab-ativas');
        const btnF = document.getElementById('tab-finalizadas');

        if (isAtivas) {
            btnA.classList.add(...active);    btnA.classList.remove(...inactive);
            btnF.classList.remove(...active); btnF.classList.add(...inactive);
        } else {
            btnF.classList.add(...active);    btnF.classList.remove(...inactive);
            btnA.classList.remove(...active); btnA.classList.add(...inactive);
        }
    }
</script>

{% endblock %}
