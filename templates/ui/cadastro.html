{% extends "base.html" %}

{% block title %}Área do Cliente{% endblock %}

{% block content %}

<section class="bg-gray-50 min-h-screen py-16">
    <div class="max-w-lg mx-auto px-4">
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">

            <!-- Ícone -->
            <div class="flex justify-center mb-5">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>

            <!-- Título -->
            <h1 class="text-2xl font-bold text-blue-950 text-center">Área do Cliente</h1>
            <p class="text-gray-500 text-sm text-center mt-1 mb-6">Entre com sua conta para acessar seus serviços</p>

            <!-- Tabs -->
            <div class="flex rounded-lg border border-gray-200 p-1 mb-6 bg-gray-50">
                <button
                    id="tab-entrar"
                    onclick="showTab('entrar')"
                    class="flex-1 py-2 text-sm font-semibold rounded-md transition-all duration-150 bg-white text-blue-900 shadow-sm">
                    Entrar
                </button>
                <button
                    id="tab-cadastrar"
                    onclick="showTab('cadastrar')"
                    class="flex-1 py-2 text-sm font-semibold rounded-md transition-all duration-150 text-gray-500 hover:text-gray-700">
                    Cadastrar
                </button>
            </div>

            <!-- Form: Entrar -->
            <div id="form-entrar">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input
                        id="login-email"
                        type="email"
                        placeholder="seu@email.com"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="mb-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input
                        id="login-password"
                        type="password"
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="text-right mb-4">
                    <a href="#" class="text-sm text-blue-600 hover:underline">Esqueci minha senha</a>
                </div>
                <div id="login-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2.5 whitespace-pre-line"></div>
                <button
                    id="btn-entrar"
                    onclick="doLogin()"
                    class="w-full bg-blue-700 hover:bg-blue-800 active:scale-95 text-white font-semibold py-3 rounded-lg transition-all duration-150 shadow-sm">
                    Entrar
                </button>
            </div>

            <!-- Form: Cadastrar -->
            <div id="form-cadastrar" class="hidden">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                    <input
                        id="reg-name"
                        type="text"
                        placeholder="João da Silva"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input
                        id="reg-email"
                        type="email"
                        placeholder="seu@email.com"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                    <input
                        id="reg-phone"
                        type="tel"
                        placeholder="(48) 99999-9999"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input
                        id="reg-password"
                        type="password"
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Senha</label>
                    <input
                        id="reg-password-confirm"
                        type="password"
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div id="reg-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2.5 whitespace-pre-line"></div>
                <button
                    id="btn-cadastrar"
                    onclick="doRegister()"
                    class="w-full bg-blue-700 hover:bg-blue-800 active:scale-95 text-white font-semibold py-3 rounded-lg transition-all duration-150 shadow-sm">
                    Criar Conta
                </button>
            </div>

        </div>
    </div>
</section>

<script>
    redirectIfLogged();

    function showTab(tab) {
        const isEntrar = tab === 'entrar';
        document.getElementById('form-entrar').classList.toggle('hidden', !isEntrar);
        document.getElementById('form-cadastrar').classList.toggle('hidden', isEntrar);

        const activeClasses = ['bg-white', 'text-blue-900', 'shadow-sm'];
        const inactiveClasses = ['text-gray-500', 'hover:text-gray-700'];
        const btnEntrar = document.getElementById('tab-entrar');
        const btnCadastrar = document.getElementById('tab-cadastrar');

        if (isEntrar) {
            btnEntrar.classList.add(...activeClasses);
            btnEntrar.classList.remove(...inactiveClasses);
            btnCadastrar.classList.remove(...activeClasses);
            btnCadastrar.classList.add(...inactiveClasses);
        } else {
            btnCadastrar.classList.add(...activeClasses);
            btnCadastrar.classList.remove(...inactiveClasses);
            btnEntrar.classList.remove(...activeClasses);
            btnEntrar.classList.add(...inactiveClasses);
        }
    }

    function showError(elId, msg) {
        const el = document.getElementById(elId);
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    function hideError(elId) {
        document.getElementById(elId).classList.add('hidden');
    }

    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.textContent = loading ? 'Aguarde...' : (btnId === 'btn-entrar' ? 'Entrar' : 'Criar Conta');
    }

    async function doLogin() {
        hideError('login-error');
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
            showError('login-error', 'Preencha e-mail e senha.');
            return;
        }

        setLoading('btn-entrar', true);
        try {
            const res  = await fetch('/api/v1/auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await res.json();

            if (!res.ok) {
                showError('login-error', parseApiErrors(data));
                return;
            }

            localStorage.setItem('vda_token', data.access);

            const meRes  = await fetch('/api/v1/auth/users/me/', {
                headers: getAuthHeaders(),
            });
            const meData = await meRes.json();
            localStorage.setItem('vda_user_type', meData.user_type);
            redirectByUserType(meData.user_type);
        } catch {
            showError('login-error', 'Erro de conexão. Tente novamente.');
        } finally {
            setLoading('btn-entrar', false);
        }
    }

    async function doRegister() {
        hideError('reg-error');
        const full_name        = document.getElementById('reg-name').value.trim();
        const email            = document.getElementById('reg-email').value.trim();
        const phone            = document.getElementById('reg-phone').value.trim();
        const password         = document.getElementById('reg-password').value;
        const password_confirm = document.getElementById('reg-password-confirm').value;

        if (!full_name || !email || !password || !password_confirm) {
            showError('reg-error', 'Preencha todos os campos obrigatórios.');
            return;
        }

        setLoading('btn-cadastrar', true);
        try {
            const res  = await fetch('/api/v1/auth/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, full_name, phone, password, password_confirm, user_type: 'CIDADAO' }),
            });
            const data = await res.json();

            if (!res.ok) {
                showError('reg-error', parseApiErrors(data));
                return;
            }

            localStorage.setItem('vda_token', data.tokens.access);
            localStorage.setItem('vda_user_type', 'CIDADAO');
            redirectByUserType('CIDADAO');
        } catch {
            showError('reg-error', 'Erro de conexão. Tente novamente.');
        } finally {
            setLoading('btn-cadastrar', false);
        }
    }

    document.getElementById('login-password').addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });
    document.getElementById('reg-password-confirm').addEventListener('keydown', e => {
        if (e.key === 'Enter') doRegister();
    });
</script>

{% endblock %}
