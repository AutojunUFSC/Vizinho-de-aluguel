{% extends "base.html" %}

{% block title %}Entrar — Vizinho de Aluguel{% endblock %}

{% block content %}

<section class="bg-gray-50 min-h-screen py-16">
    <div class="max-w-lg mx-auto px-4">
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">

            <!-- Ícone -->
            <div class="flex justify-center mb-5">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>

            <!-- Título -->
            <h1 class="text-2xl font-bold text-blue-950 text-center">Área do Cliente</h1>
            <p class="text-gray-500 text-sm text-center mt-1 mb-6">Entre com sua conta para acessar seus serviços</p>

            <!-- Alerta de cadastro realizado -->
            <div id="alert-success" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700">
                Conta criada com sucesso! Faça login para continuar.
            </div>

            <!-- Alerta de erro -->
            <div id="alert-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700 whitespace-pre-line"></div>

            <!-- Formulário -->
            <form id="form-login" onsubmit="handleLogin(event)" novalidate>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input
                        id="login-email"
                        type="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="mb-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input
                        id="login-password"
                        type="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="text-right mb-6">
                    <a href="#" class="text-sm text-blue-600 hover:underline">Esqueci minha senha</a>
                </div>
                <button
                    id="btn-login"
                    type="submit"
                    class="w-full bg-blue-700 hover:bg-blue-800 active:scale-95 text-white font-semibold py-3 rounded-lg transition-all duration-150 shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">
                    Entrar
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-6">
                Não tem conta?
                <a href="{% url 'cadastro' %}" class="text-blue-600 hover:underline font-medium">Cadastre-se grátis</a>
            </p>

        </div>
    </div>
</section>

<script>
    redirectIfLogged();

    if (new URLSearchParams(window.location.search).get('cadastro') === 'ok') {
        document.getElementById('alert-success').classList.remove('hidden');
    }

    async function handleLogin(e) {
        e.preventDefault();

        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn      = document.getElementById('btn-login');
        const alertErr = document.getElementById('alert-error');

        alertErr.classList.add('hidden');
        btn.disabled    = true;
        btn.textContent = 'Entrando…';

        try {
            const res  = await fetch('/api/v1/auth/login/', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email, password }),
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('vda_token',     data.token);
                localStorage.setItem('vda_user_type', data.user_type);
                redirectByUserType(data.user_type);
            } else {
                alertErr.textContent = parseApiErrors(data) || 'E-mail ou senha inválidos.';
                alertErr.classList.remove('hidden');
            }
        } catch {
            alertErr.textContent = 'Erro de conexão. Verifique sua internet e tente novamente.';
            alertErr.classList.remove('hidden');
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Entrar';
        }
    }
</script>

{% endblock %}
